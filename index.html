<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMC com WhatsApp</title>

<style>

body{
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #f5f5f5;
    padding: 30px;
}

.container{
    background: white;
    max-width: 400px;
    margin: auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
}

input{
    width: 90%;
    padding: 10px;
    margin: 8px;
}

button{
    background-color: #25D366;
    color: white;
    border: none;
    padding: 12px 20px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover{
    opacity: 0.9;
}

#resultado{
    margin-top: 15px;
    font-size: 18px;
}

</style>
</head>

<body>

<div class="container">

<h2>Calculadora de IMC</h2>

<input type="text" id="nome" placeholder="Digite seu nome">

<input type="number" id="peso" placeholder="Peso (kg)" step="0.1">

<input type="number" id="altura" placeholder="Altura (m)" step="0.01">

<input type="text" id="numero" placeholder="Número WhatsApp (Ex: 5522999999999)">

<br><br>

<button onclick="calcularEEnviar()">
Calcular e Enviar
</button>

<p id="resultado"></p>

</div>

<script>

function calcularEEnviar(){

    let nome = document.getElementById("nome").value;
    let peso = parseFloat(document.getElementById("peso").value);
    let altura = parseFloat(document.getElementById("altura").value);
    let numero = document.getElementById("numero").value;

    if(nome === "" || !peso || !altura || numero === ""){
        alert("Preencha todos os campos.");
        return;
    }

    let imc = peso / (altura * altura);

    let classificacao = "";

    if(imc < 18.5){
        classificacao = "Abaixo do peso";
    }
    else if(imc < 25){
        classificacao = "Peso ideal";
    }
    else if(imc < 30){
        classificacao = "Sobrepeso";
    }
    else{
        classificacao = "Obesidade";
    }

    document.getElementById("resultado").innerHTML =
        "<strong>" + nome + "</strong><br>" +
        "IMC: " + imc.toFixed(2) + "<br>" +
        "Classificação: " + classificacao;

    let mensagem =
        "Olá " + nome + "! Seu IMC é " +
        imc.toFixed(2) +
        ". Classificação: " +
        classificacao + ".";

    let url =
        "https://wa.me/" +
        numero +
        "?text=" +
        encodeURIComponent(mensagem);

    window.open(url, "_blank");
}

</script>

</body>
</html>
